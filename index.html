<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casio | ZZZCulture</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="spotlight">
      <div class="spotlight-intro-text-wrapper">
        <div class="spotlight-intro-text"><p>ZZZ</p></div>
        <div class="spotlight-intro-text"><p>Culture</p></div>
      </div>

      <div class="spotlight-bg-img">
        <img src="/main.png" alt="" />
      </div>

      <div class="spotlight-titles-container">
        <div class="spotlight-titles"></div>
      </div>

      <div class="spotlight-images"></div>

      <div class="spotlight-header">
        <p>Models</p>
      </div>
    </section>

    <section class="catalog">
      <div class="catalog-inner">
        <p class="catalog-label">Quentin Mods</p>
        <h2 class="catalog-title">Current lineup</h2>
        <ul class="catalog-list"></ul>
      </div>
    </section>

    <section class="outro">
      <h1>ZZZCulture</h1>
    </section>
    <script type="module" src="/script.js"></script>
  </body>
</html>
